<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoConverter Pro</title><style>*{box-sizing:border-box}body{margin:0;padding:clamp(14px,3vw,32px);background:linear-gradient(135deg,#fdf2f8,#fff,#fce7f3);font:15px Arial,sans-serif;color:#374151}.shell{max-width:1280px;margin:auto}.head{text-align:center;margin:4px 0 24px}.mark{display:inline-grid;place-items:center;background:#db2777;color:#fff;border-radius:14px;width:52px;height:52px;font-size:24px;box-shadow:0 8px 20px #db277744}.head h1{margin:12px 0 6px;color:#111827;font-size:clamp(30px,5vw,40px)}.head p{margin:0;color:#6b7280;line-height:1.5}.panel{background:#fff;border:1px solid #f1f5f9;border-radius:20px;padding:clamp(16px,3vw,28px);box-shadow:0 12px 40px #83184318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,28px)}.label{display:block;font-weight:bold;font-size:13px;margin:0 0 8px}.select,.drop{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font:inherit}.drop{display:block;border:2px dashed #f9a8d4;text-align:center;cursor:pointer;padding:26px 18px;background:#fff7fb;transition:border-color .2s,background .2s}.drop:hover,.drop:focus-within{border-color:#db2777;background:#fdf2f8}.drop input{position:absolute;width:1px;height:1px;opacity:0}.drop span{color:#64748b;font-size:13px;line-height:1.6}.drop strong{display:block;color:#9d174d;font-size:15px;margin-bottom:3px}.settings{margin-top:18px;padding:18px;background:#fdf2f8;border-radius:10px}.settings div{display:flex;justify-content:space-between;gap:12px;margin:7px 0;font-size:14px}.settings span{color:#64748b}.actions{display:flex;gap:10px;margin-top:18px}.button{flex:1;border:0;border-radius:9px;padding:13px;font-weight:bold;cursor:pointer;transition:transform .15s,box-shadow .15s}.button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 14px #83184322}.button:disabled{opacity:.5;cursor:not-allowed}.preview{border:1px solid #cbd5e1;background:#fff;color:#1e293b}.convert{background:#db2777;color:#fff}.message{margin-top:16px;padding:13px;border-radius:9px;line-height:1.5}.status{background:#eff6ff;color:#1d4ed8}.error{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fef2f2;color:#b91c1c}.retry{border:0;border-radius:7px;background:#b91c1c;color:#fff;padding:8px 12px;font-weight:bold;cursor:pointer;white-space:nowrap}.box{margin-top:18px;border:1px solid #e2e8f0;border-radius:9px;padding:14px}.box h2{margin:0 0 10px;font-size:16px;color:#111827}.box pre{max-height:260px;overflow:auto;margin:0;padding:10px;background:#f8fafc;font-size:12px;white-space:pre-wrap}.player{overflow:hidden;background:#020617;border-radius:10px;border:1px solid #cbd5e1}.player-head,.controls{display:flex;align-items:center;gap:10px;padding:11px 14px;color:#e2e8f0;font-size:13px}.player-head{justify-content:space-between;border-bottom:1px solid #ffffff1a}.viewport{position:relative;aspect-ratio:16/9;overflow:hidden}.viewport>*{position:absolute}.viewport img{object-fit:cover}.viewport .txt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.3}.controls{flex-wrap:wrap;background:#0f172a}.controls button{border:0;background:transparent;color:#fff;cursor:pointer;font-size:18px;width:32px;height:30px;border-radius:6px}.controls button:hover{background:#ffffff1a}.controls input{flex-basis:100%;accent-color:#ec4899}.time{font-variant-numeric:tabular-nums}.spacer{flex:1}.scene-nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:#0f172a}.scene-nav button{border:1px solid #475569;border-radius:6px;background:#1e293b;color:#e2e8f0;padding:6px 10px;cursor:pointer;white-space:nowrap}.scene-nav button:hover{border-color:#f9a8d4;color:#fff}@media(max-width:760px){body{padding:12px}.grid{grid-template-columns:1fr}.actions{flex-direction:column}.error{align-items:stretch;flex-direction:column}.retry{width:100%}}.drop{border:2px dashed #f9a8d4;background:#fff7fb;padding:26px 18px}.drop:hover,.drop:focus-within{border-color:#db2777;background:#fdf2f8}.drop input{position:absolute;width:1px;height:1px;opacity:0}.drop strong{display:block;color:#9d174d}.actions{gap:12px}.button{border-radius:9px}.error{display:flex;align-items:center;justify-content:space-between;gap:12px}.retry{border:0;border-radius:7px;background:#b91c1c;color:#fff;padding:8px 12px;font-weight:bold}@media(max-width:760px){.error{align-items:stretch;flex-direction:column}.retry{width:100%}}</style></head><body><main class="shell"><header class="head"><div class="mark">▶</div><h1>Video Converter</h1><p>Transform your text documents into engaging videos with our AI-powered converter</p></header><section class="panel"><div class="grid"><div><label class="label">Document Type</label><select id="type" class="select"><option>Select Text Document</option><option>PDF Document</option><option>Word Document</option><option>PowerPoint</option><option>Text File</option></select><label class="label" style="margin-top:20px">Upload Document</label><label class="drop"><input id="file" type="file" accept=".txt,.pdf,.doc,.docx,.ppt,.pptx,.json"><span id="fileName"><strong>Drop your document here</strong>Choose a file<br><small id="fileFormats">PDF, DOC, DOCX, TXT, JSON, PPT, PPTX</small></span></label></div><div><label class="label">Output Video Format</label><select class="select"><option>MP4 (H.264)</option><option>MP4 (H.265)</option><option>WebM</option><option>GIF</option><option>MOV ProRes</option></select><div class="settings"><div><span>Resolution:</span><b>1920x1080</b></div><div><span>Duration:</span><b>Auto-detect</b></div><div><span>Quality:</span><b>High</b></div></div><div class="actions"><button id="previewBtn" class="button preview" disabled>Preview first</button><button id="convertBtn" class="button convert" disabled>Generate Video</button></div></div></div><div id="message"></div><div id="diagnostics"></div><div id="movieJson"></div><div id="preview"></div></section></main><script>
(()=>{const origin=location.origin;const file=document.querySelector('#file'),nameEl=document.querySelector('#fileName'),previewBtn=document.querySelector('#previewBtn'),convertBtn=document.querySelector('#convertBtn'),message=document.querySelector('#message'),diag=document.querySelector('#diagnostics'),json=document.querySelector('#movieJson'),preview=document.querySelector('#preview');let selected=null,movie=null,pos=0,playing=false,last=0,raf=0,timeline={durations:[],boundaries:[],total:0};const post=(type,payload={})=>parent.postMessage({source:'document-preview-iframe',type,payload},origin);const friendlyError='Something went wrong while creating your video. Please try again.';const safeJson=async(res)=>{const ct=res.headers.get('content-type')||'';const text=await res.text();if(!ct.toLowerCase().includes('application/json')){console.error('Expected JSON response but received a non-JSON response',{status:res.status,statusText:res.statusText,contentType:ct,body:text.slice(0,1000)});throw new Error(friendlyError)}try{return JSON.parse(text)}catch(e){console.error('Failed to parse JSON response',{status:res.status,statusText:res.statusText,contentType:ct,body:text.slice(0,1000),error:e});throw new Error(friendlyError)}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const total=()=>timeline.total;const buildTimeline=()=>{let elapsed=0;timeline={durations:(movie?.scenes||[]).map(s=>Math.max(0,Number(s.duration)||0)),boundaries:[],total:0};timeline.durations.forEach(d=>{elapsed+=d;timeline.boundaries.push(elapsed)});timeline.total=elapsed;};const fmt=n=>{n=Math.floor(n);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};function active(){const index=Math.min(timeline.boundaries.findIndex(boundary=>pos<boundary)<0?movie.scenes.length-1:timeline.boundaries.findIndex(boundary=>pos<boundary),movie.scenes.length-1);const previous=index?timeline.boundaries[index-1]:0;return {scene:movie.scenes[index],index,offset:Math.max(0,pos-previous)}}function frame(){if(!movie)return;const a=active(),s=a.scene,v=document.querySelector('.viewport');if(!v)return;const scale=v.clientWidth/1280;v.innerHTML='';for(const e of s.elements||[]){const st={left:(+e.x||0)/1280*100+'%',top:(+e.y||0)/720*100+'%',width:(+(e.size?.width||e.width||0))/1280*100+'%',height:e.size?.height?(+e.size.height)/720*100+'%':e.height?(+e.height)/720*100+'%':undefined};if(e.type==='image'){const im=document.createElement('img');im.src=e.src;Object.assign(im.style,st,{opacity:e.opacity??1});v.append(im)}else if(e.type==='text'){const t=document.createElement('div');t.className='txt';t.textContent=e.text||'';Object.assign(t.style,st,{color:e.color||'#fff',fontFamily:e.fontFamily||'Arial',fontSize:(+e.fontSize||24)*scale+'px',lineHeight:(+e.fontSize||24)*1.28*scale+'px',fontWeight:e.fontWeight||'normal',textAlign:e.align||'left',overflow:'hidden'});v.append(t)}}document.querySelector('#sceneInfo').textContent='Scene '+(a.index+1)+' of '+movie.scenes.length+' · '+fmt(total());document.querySelector('#time').textContent=fmt(pos)+' / '+fmt(total());const range=document.querySelector('#range');range.min='0';range.max=String(total());range.step='0.01';range.value=String(Math.min(Math.max(pos,0),total()));post('preview-state',{sceneIndex:a.index,position:pos,totalDuration:total()})}function tick(t){if(!last)last=t;pos+=(t-last)/1000;last=t;if(pos>=total()){pos=total();playing=false}frame();if(playing)raf=requestAnimationFrame(tick)}function play(){if(pos>=total())pos=0;playing=!playing;last=0;if(playing)raf=requestAnimationFrame(tick);else cancelAnimationFrame(raf);document.querySelector('#play').textContent=playing?'Ⅱ':'▶';post('preview-playback',{playing});frame()}function show(data){movie=data.movie;buildTimeline();pos=0;playing=false;diag.innerHTML='<details class="box"><summary>Developer details</summary><h2>Scene Planning Diagnostics</h2><pre>'+esc(JSON.stringify({...data.diagnostics,PREVIEW_SCENE_DURATIONS:timeline.durations,PREVIEW_TOTAL_DURATION:timeline.total},null,2))+'</pre><h2>Generated Movie JSON (Multi-Scene)</h2><pre>'+esc(JSON.stringify(movie,null,2))+'</pre></details>';json.innerHTML='';preview.innerHTML='<div class="box"><h2>Continuous Movie Preview</h2><div class="player"><div class="player-head"><span id="sceneInfo"></span><span>Local preview</span></div><div class="viewport" aria-label="Continuous movie frame"></div><div class="controls"><button id="play" aria-label="Play preview">▶</button><button id="restart" aria-label="Restart preview">↺</button><button id="mute" aria-label="Mute preview">🔊</button><span id="time" class="time"></span><span class="spacer"></span><button id="full" aria-label="Fullscreen">⛶</button><input id="range" type="range" min="0" step=".01" aria-label="Preview progress"></div><div class="scene-nav" aria-label="Scene navigation"></div></div></div></div>';document.querySelector('#play').onclick=play;document.querySelector('#restart').onclick=()=>{pos=0;playing=true;last=0;raf=requestAnimationFrame(tick);frame()};document.querySelector('#range').oninput=e=>{pos=+e.target.value;frame()};const sceneNav=document.querySelector('.scene-nav');sceneNav.innerHTML=(movie.scenes||[]).map((s,i)=>'<button type="button" data-scene="'+i+'" aria-label="Go to scene '+(i+1)+'">Scene '+(i+1)+'</button>').join('');sceneNav.querySelectorAll('button').forEach(button=>button.onclick=()=>{const index=+button.dataset.scene;pos=index?timeline.boundaries[index-1]:0;playing=false;last=0;frame()});document.querySelector('#full').onclick=()=>preview.requestFullscreen?.();document.querySelector('#mute').onclick=e=>e.currentTarget.textContent=e.currentTarget.textContent==='🔇'?'🔊':'🔇';frame();post('movie-ready',{movie,diagnostics:data.diagnostics})}window.__EXPORT__={loadMovie:(movieArg)=>{try{show({movie:movieArg,diagnostics:{}});playing=false;const v=document.querySelector('.viewport');if(v){v.style.width='1280px';v.style.height='720px';v.style.aspectRatio='auto'}const p=document.querySelector('.player');if(p){p.style.width='1280px'}return true}catch(e){return false}},seek:(t)=>{pos=Math.min(Math.max(Number(t)||0,0),total());frame();return pos},getTotalDuration:()=>total(),getSceneCount:()=>movie?movie.scenes.length:0};async function submitToJson2VideoLegacy(movieToRender){const rr=await fetch('/api/render-json2video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({movie:movieToRender})});const rd=await safeJson(rr);post('render-response',rd);if(!rr.ok||rd.success===false)throw Error(rd.error||rd.message||'Render failed');return rd}async function convert(finalize){if(!selected)return;movie=null;pos=0;playing=false;cancelAnimationFrame(raf);diag.innerHTML='';json.innerHTML='';preview.innerHTML='';message.innerHTML='<div class="message status">Reading your document...</div>';post('conversion-started',{fileName:selected.name});try{const r=await fetch('/api/convert-document',{method:'POST',headers:{'Content-Type':selected.type||'application/octet-stream','X-Filename':selected.name},body:await selected.arrayBuffer()});const d=await safeJson(r);if(!r.ok||!d.success)throw Error(d.error||'Conversion failed');show(d);if(!finalize)message.innerHTML='<div class="message status">Video ready!</div>';post('conversion-complete',{diagnostics:d.diagnostics});if(finalize){pos=0;playing=true;last=0;raf=requestAnimationFrame(tick);frame();message.innerHTML='<div class="message status">Preparing your preview...</div>';post('render-complete',{mode:'html-preview',totalDuration:total(),sceneCount:movie.scenes.length});try{const er=await fetch('/api/export-video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({movie:d.movie})});const ed=await safeJson(er);if(!er.ok||!ed.success)throw Error(ed.error||'Export failed');message.innerHTML='<div class="message status">Video ready!</div>';post('render-complete',{mode:'mp4',videoUrl:ed.videoUrl,sceneCount:movie.scenes.length,totalDuration:total()})}catch(exportErr){console.error('MP4 export failed',exportErr);message.innerHTML='<div class="message error"><span>'+friendlyError+'</span><button type="button" class="retry" id="retryBtn">Try again</button></div>';document.querySelector('#retryBtn').onclick=()=>convert(true);post('preview-error',{message:friendlyError})}}}catch(e){console.error('Video conversion failed',e);message.innerHTML='<div class="message error"><span>'+friendlyError+'</span><button type="button" class="retry" id="retryBtn">Try again</button></div>';document.querySelector('#retryBtn').onclick=()=>convert(true);post('preview-error',{message:friendlyError})}}const formatBytes=size=>{if(!size)return '0 B';const units=['B','KB','MB','GB'];const index=Math.min(Math.floor(Math.log(size)/Math.log(1024)),units.length-1);return (size/Math.pow(1024,index)).toFixed(index?1:0)+' '+units[index]};const formatType=fileArg=>{const type=(fileArg.type||'').split('/').pop();return type?type.toUpperCase():((fileArg.name.split('.').pop()||'FILE').toUpperCase())};file.onchange=()=>{selected=file.files[0]||null;nameEl.innerHTML=selected?'<strong>'+esc(selected.name)+'</strong><br>'+formatBytes(selected.size)+' · '+esc(formatType(selected)):'<strong>Drop your document here</strong>Choose a file<br><small id="fileFormats">PDF, DOC, DOCX, TXT, JSON, PPT, PPTX</small>';previewBtn.disabled=!selected;convertBtn.disabled=!selected};previewBtn.onclick=()=>convert(false);convertBtn.onclick=()=>convert(true);post('iframe-ready',{version:1})})();
</script></body></html>
