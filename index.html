<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VideoConverter Pro</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;background:#fff}
    .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffd6e7 0%,#fff 60%)}
    .card{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:32px;max-width:720px;margin:24px}
    .title{font-size:28px;font-weight:800;margin:0 0 8px}
    .subtitle{color:#444;margin:0 0 20px}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    a.btn{display:inline-block;padding:12px 16px;border-radius:10px;text-decoration:none;font-weight:700}
    a.primary{background:#ff4da0;color:#fff}
    a.secondary{background:#f2f2f2;color:#111}
  </style>
</head>
<body>
  <main class="hero">
    <section class="card">
      <h1 class="title">VideoConverter Pro</h1>
      <p class="subtitle">Turn documents into videos with an AI-driven pipeline. Use the converter to try a demo.</p>
      <div class="actions">
        <a class="btn primary" href="/video-converter.html">Open Converter</a>
        <a class="btn secondary" href="/app">Next.js App</a>
      </div>
    </section>
  </main>
</body>
</html>
